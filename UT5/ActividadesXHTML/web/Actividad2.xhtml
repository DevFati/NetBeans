<math xmlns="http://www.w3.org/1998/Math/MathML">
    <mrow>
        <!-- Variable a -->
        <mi>a</mi>
        <!-- Igual -->
        <mo>=</mo>
        <!-- Raíz cuadrada -->
        <msqrt>
            <mrow>
                <!-- c al cuadrado -->
                <msup>
                    <mi>c</mi>
                    <mn>2</mn>
                </msup>
                <!-- Resta -->
                <mo>-</mo>
                <!-- b al cuadrado -->
                <msup>
                    <mi>b</mi>
                    <mn>2</mn>
                </msup>
            </mrow>
        </msqrt>
    </mrow>
</math>
