    <h1>Interfaz de Usuario</h1>
    <p>El juego cuenta con una interfaz gráfica sencilla e intuitiva:</p>
    <ul>
        <li>Una cuadrícula de 3x3 donde los jugadores colocan sus marcas (X o O).</li>
        <li>Un botón de <strong>Reiniciar</strong> para empezar una nueva partida.</li>
        <li>Un marcador que muestra el turno actual.</li>
    </ul>
