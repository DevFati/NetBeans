    <h1>Introducción</h1>
    <p>Bienvenido al juego <strong>3 en Raya</strong>. Es un clásico juego de estrategia en el que dos jugadores intentan alinear tres marcas en una cuadrícula de 3x3.</p>
    <p>El objetivo del juego es conseguir tres marcas en línea horizontal, vertical o diagonal antes que el oponente.</p>
